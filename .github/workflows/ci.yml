name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure should not hide the other's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - name: cargo test --workspace
        shell: bash
        # Failing tests become annotations, which show on the run's summary (and in the API)
        # without opening the log.
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log || {
            grep -E '^---- .* stdout ----$|panicked at|^test .* FAILED$' test.log | head -40 |
              sed -e 's/%/%25/g' -e 's/^/::error title=cargo test::/'
            exit 1
          }
      - run: scripts/test-install-keeper.sh

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources
      - name: Libraries must not depend on apps/*
        run: |
          python3 -m unittest scripts/test_check_no_app_deps.py
          python3 scripts/check-no-app-deps.py

  desktop-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/desktop-mobile/ui
      - run: npm run check
        working-directory: apps/desktop-mobile/ui
      - run: npm test
        working-directory: apps/desktop-mobile/ui
      - run: npm run build
        working-directory: apps/desktop-mobile/ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: App core and HTTP bridge tests
        run: cargo test -p desktop-mobile --features http
      - name: TypeScript bindings are up to date
        run: git diff --exit-code apps/desktop-mobile/ui/src/bindings
      - name: Third-party licence notices are up to date
        run: python3 scripts/licences.py --check

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The guides build and every local link in the site resolves
        run: |
          python3 site/build.py --check
          git diff --exit-code site/guides

