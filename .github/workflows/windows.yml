name: Windows build

# Builds the desktop app on Windows the way the release does (the MSI and the NSIS installer, with the search
# models), so a Windows-only compile failure shows up on a branch and not when a release tag is pushed.
# Run it by hand from the Actions tab, or by pushing the `windows-build` branch. The installers are kept for a week
# as the `desktop-windows` artifact. Nothing is signed: SmartScreen warns on first run.

on:
  workflow_dispatch:
  push:
    branches: [windows-build]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('xtask/src/models.rs', 'scripts/quantize_clip.py', 'scripts/ocr_dict.py') }}
      - name: Search models match the hashes compiled in
        run: cargo xtask models --check
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: apps/desktop-mobile/ui
      - name: Build
        working-directory: apps/desktop-mobile/src-tauri
        run: cargo tauri build --features tauri-app --config tauri.models.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
