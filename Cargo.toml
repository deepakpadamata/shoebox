[workspace]
resolver = "2"
members = [
    "crates/shoebox-core",
    "crates/shoebox-store-mem",
    "crates/shoebox-store-docs",
    "crates/shoebox-store-loro",
    "crates/shoebox-store",
    "crates/shoebox-media",
    "crates/shoebox-node",
    "crates/shoebox-testkit",
    "apps/keeper",
    "apps/desktop-mobile/src-tauri",
    "tools/store-bench",
    "tools/shoebox-dev",
    "xtask",
    "examples/hello-sync",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/deepakpadamata/shoebox"

[workspace.dependencies]
# --- iroh stack: pinned exactly; bump deliberately (see docs/notes/iroh-versions.md) ---
iroh = "=1.4.1"
iroh-blobs = "=0.103.1"
iroh-gossip = "=0.101.0"
iroh-docs = "=0.101.0"
iroh-mdns-address-lookup = "=0.6.1" # LAN discovery (M1-09); a separate crate in iroh 1.x

# --- shared libs ---
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
blake3 = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
proptest = "1"
hex = "0.4"
anyhow = "1"
tracing = "0.1"
toml = "0.8"
tempfile = "3"
bytes = "1"

# --- internal crates ---
shoebox-core = { path = "crates/shoebox-core" }
shoebox-store-mem = { path = "crates/shoebox-store-mem" }
shoebox-store-docs = { path = "crates/shoebox-store-docs" }
shoebox-store-loro = { path = "crates/shoebox-store-loro" }
shoebox-store = { path = "crates/shoebox-store" }
shoebox-media = { path = "crates/shoebox-media" }
shoebox-node = { path = "crates/shoebox-node" }
shoebox-testkit = { path = "crates/shoebox-testkit" }

# Keep build artifacts small: full debuginfo for the iroh dependency tree made `target/` 13 GB.
[profile.dev]
debug = "line-tables-only"
# The incremental cache alone grew past 4 GB here; builds are fast enough without it.
incremental = false

# Dependencies are built optimised even in debug builds; our own crates stay quick to rebuild.
# Unoptimised crypto, hashing and iroh-docs' database made tests ten times slower on x86 Linux than
# on Apple silicon (a 1,500-record sync: 35 s against 0.4 s optimised), so they failed on CI and on
# the keeper box; and a debug phone build read video at 3 MB/s, slower than the video plays.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Smaller downloads: the keeper went from 47.6 MB to 27.7 MB (macOS arm64). Fat LTO failed to link and took longer.
# Panics still unwind: media import and the Android JNI bridge catch them.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
