[package]
name = "shoebox-cloud-worker"
description = "Shoebox Cloud on Cloudflare: a Worker serving the viewer page, a Durable Object keeping the books, R2 holding the bytes."
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

# Everything is for the Workers runtime (wasm32); on any other target the crate is empty, so workspace builds pass.
[target.'cfg(target_arch = "wasm32")'.dependencies]
shoebox-cloud = { path = "../cloud", default-features = false }
worker = "0.8.7"
axum = { version = "0.8", default-features = false }
wasm-bindgen = "=0.2.129"
tower = { version = "0.5", features = ["util"] }
futures.workspace = true
anyhow.workspace = true
url = "2"
# The Workers runtime has `crypto.getRandomValues`; these pick it.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true
