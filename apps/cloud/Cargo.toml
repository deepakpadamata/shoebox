[package]
name = "shoebox-cloud"
description = "Shoebox Cloud: a zero-knowledge store for ciphertext. Serves web links to shared albums and is the cloud keeper (W1-04)."
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[lib]
name = "shoebox_cloud"
path = "src/lib.rs"

[[bin]]
name = "shoebox-cloud"
path = "src/main.rs"

[dependencies]
shoebox-core.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { workspace = true, features = ["net", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures.workspace = true
bytes.workspace = true
blake3.workspace = true
hex.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json = "1"
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
