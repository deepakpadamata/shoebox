[package]
name = "desktop-mobile"
description = "Shoebox desktop (and later mobile) app: the app core, a dev HTTP bridge and the Tauri shell."
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[lib]
name = "desktop_mobile"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desktop-dev-server"
path = "src/bin/dev_server.rs"
required-features = ["http"]

[[bin]]
name = "shoebox-desktop"
path = "src/main.rs"
required-features = ["tauri-app"]

[features]
default = []
# A plain HTTP bridge to the same commands (dev, UI review in a browser, end-to-end tests).
http = ["dep:axum", "dep:tokio-stream", "dep:tower-http", "dep:clap"]
# The Tauri 2 shell. Needs the platform webview; see README.md.
# The plugins come with it: without this feature nothing pulls in Tauri, so the core builds and tests on a
# Linux machine without GTK and WebKitGTK.
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "keyring",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-barcode-scanner",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
]
# Platform keystore (macOS Keychain, Windows Credential Manager, Secret Service).
keyring = ["dep:keyring"]

[dependencies]
shoebox-core.workspace = true
shoebox-node.workspace = true
shoebox-store.workspace = true
shoebox-media.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "signal", "process"] }
futures.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10", features = ["serde-compat"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum = { version = "0.8", optional = true }
tokio-stream = { version = "0.1", optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
tauri = { version = "2", optional = true, features = ["tray-icon"] }
# keyring 3 has no backend unless one is chosen per platform: without one it silently uses an
# in-memory mock and the device key would be new on every start.
keyring = { version = "3", optional = true }

getrandom = "0.3"
base64 = "0.22"
clap = { version = "4", features = ["derive"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }
# The share picker (`share.rs`); the same versions Tauri already builds.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, default-features = false, features = ["std", "NSResponder", "NSSharingService", "NSView"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSGeometry", "NSURL"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = { version = "2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile.workspace = true
shoebox-core = { workspace = true, features = ["testing"] }
xtask = { path = "../../../xtask" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

# Like the workspace (no unsafe code), except that the JNI entry point of the Android background
# bridge needs `#[no_mangle]` and the macOS share picker calls AppKit; those two modules opt in.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
