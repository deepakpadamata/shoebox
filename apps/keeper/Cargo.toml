[package]
name = "keeper"
description = "shoebox-keeper: the always-on backstop device (daemon, control socket, CLI)."
version.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "AGPL-3.0-only"
publish = false

[lib]
name = "keeper"
path = "src/lib.rs"

[[bin]]
name = "shoebox-keeper"
path = "src/main.rs"

[dependencies]
shoebox-core.workspace = true
shoebox-node.workspace = true
shoebox-search.workspace = true
shoebox-ml.workspace = true
# HEIC and AVIF-free HEVC decoding, built in and static: a keeper needs no libheif on the machine (I1-02).
shoebox-media = { workspace = true, features = ["heic-static"] }
shoebox-store.workspace = true
tokio = { workspace = true, features = ["signal", "net", "io-util", "fs"] }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
hex.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tikv-jemallocator = { version = "0.6", optional = true }

# The Linux release is static musl, and musl's allocator keeps what the indexer and the blob store free:
# a keeper on it reached 19 GB in a day, 24,000 small mappings and never shrinking. On jemalloc the same
# keeper stayed under 900 MB for hours and gave memory back.
[target.'cfg(target_env = "musl")'.dependencies]
tikv-jemallocator = "0.6"

[features]
# Diagnostic build: jemalloc with heap profiling (finding where a long-running keeper's memory goes). Set up
# through `_RJEM_MALLOC_CONF`; glibc builds only, since active profiling crashes the static musl binary.
jemalloc-prof = ["dep:tikv-jemallocator", "tikv-jemallocator/profiling"]

[dev-dependencies]
tempfile.workspace = true
shoebox-node = { workspace = true }

[lints]
workspace = true
