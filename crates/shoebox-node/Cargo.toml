[package]
name = "shoebox-node"
description = "The Shoebox runtime: owns the iroh endpoint, blob store and library store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
shoebox-core.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-gossip.workspace = true
iroh-docs.workspace = true
iroh-mdns-address-lookup.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
bytes.workspace = true
hex.workspace = true
blake3.workspace = true
getrandom = "0.3"
postcard.workspace = true
shoebox-media.workspace = true
shoebox-search.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
notify = "8"
serde_json = "1"
# Update checks (R1-07): the same reqwest and TLS stack iroh already brings.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Free space before an import (I1-04), without unsafe code.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
shoebox-store-mem.workspace = true
xtask = { path = "../../xtask" }

[lints]
workspace = true
