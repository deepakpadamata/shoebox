[package]
name = "shoebox-store"
description = "The production store: personal library on Loro, shared albums on iroh-docs (decision #7)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
shoebox-core.workspace = true
shoebox-node.workspace = true
shoebox-store-loro.workspace = true
shoebox-store-docs.workspace = true
async-trait.workspace = true
anyhow.workspace = true
blake3.workspace = true
getrandom = "0.3"
iroh.workspace = true
futures.workspace = true
hex.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json = "1"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
shoebox-testkit.workspace = true
shoebox-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
iroh-blobs.workspace = true
xtask = { path = "../../xtask" }
bytes.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
