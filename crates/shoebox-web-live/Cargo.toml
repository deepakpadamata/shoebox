[package]
name = "shoebox-web-live"
description = "The browser side of a Live web link: reaches a device by its endpoint id over iroh and speaks shoebox/webview/0. WebAssembly only; loaded by the viewer page when a Live link is opened."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything is for wasm32; on other targets this crate is empty, so `cargo build --workspace` is unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
n0-future = "0.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

[lints]
workspace = true
