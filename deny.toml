# cargo-deny config (M0-03). Library crates are Apache-2.0 OR MIT, so copyleft dependencies
# (AGPL/GPL/LGPL) must never enter the graph. Apps are AGPL but can only *consume* libraries.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
unused-allowed-license = "allow"

# IJG is permissive but requires attribution in shipped binaries. jpeg-encoder encodes the thumbnails
# and previews (shoebox-media) and the xtask fixtures; its LICENSE-IJG is in each app's
# THIRD-PARTY-LICENSES.txt (scripts/licences.py collects it). Allowed for that crate alone.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

[licenses.private]
# Our own workspace crates (publish = false) are not license-checked here; apps/* are AGPL by design.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
