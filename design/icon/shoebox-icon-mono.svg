    <g transform="scale(10.24) rotate(-10 50 50)">
      <circle cx="27" cy="35" r="4.5" fill="#fff"/>
      <rect x="14" y="24" width="46" height="32" rx="3" fill="none" stroke="#fff" stroke-width="6"/>
      <rect x="15" y="50" width="44" height="6" fill="#fff"/>
      <rect x="40" y="44" width="46" height="32" rx="3" fill="none" stroke="#000" stroke-width="10"/>
      <path d="M43 70 L53 61 L60 66 L69 54 L83 68 L83 70 Z" fill="#fff"/>
      <rect x="40" y="44" width="46" height="32" rx="3" fill="none" stroke="#fff" stroke-width="6"/>
      <rect x="41" y="70" width="44" height="6" fill="#fff"/>
      <line x1="60" y1="38" x2="60" y2="49" stroke="#000" stroke-width="10"/>
      <line x1="60" y1="36" x2="60" y2="50" stroke="#fff" stroke-width="6"/>
