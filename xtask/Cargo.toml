[package]
name = "xtask"
description = "Developer tasks: `cargo xtask fixtures` (synthetic photo corpus), `cargo xtask samples` and `cargo xtask gazetteer`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 OR MIT"
publish = false

[dependencies]
blake3.workspace = true
jpeg-encoder = "0.7"
png = "0.18"
serde.workspace = true
serde_json = "1"
shoebox-search.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
kamadak-exif = "0.6"

[lints]
workspace = true
